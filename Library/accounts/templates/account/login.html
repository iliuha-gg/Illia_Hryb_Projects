{% extends "books/base.html" %}

{% block content %}
    <h1>Вход в аккаунт</h1>

    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Войти
        </button>
    </form>

    <p>
        Нет аккаунта?
        <a href="{% url 'account_signup' %}">
            Зарегистрироваться
        </a>
    </p>
{% endblock %}
